# AutoSpec Configuration — TodoApp Example
project:
  name: "TodoApp"
  description: "A simple todo list web app with user authentication"

environment: claude-code
# Options: claude-code, cursor, vscode-copilot, windsurf, jetbrains-ai, aider

models:
