version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: mealmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mealmap
      POSTGRES_PASSWORD: mealmap_dev
      POSTGRES_DB: mealmap
    ports:
      - '5432:5432'
    volumes:
      - mealmap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mealmap -d mealmap']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mealmap_pgdata:
    driver: local
