name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/configure-pages@v5

      # Build presentation (main site)
      - run: npm ci
        working-directory: presentation
      - run: npm run build
        working-directory: presentation

      # Build viewer (sub-site)
      - run: npm ci
        working-directory: viewer
      - run: npm run build
        working-directory: viewer

      # Combine: copy viewer into presentation/dist/viewer/
      - run: mkdir -p presentation/dist/viewer && cp -r viewer/dist/* presentation/dist/viewer/

      # Build LSS presentation (sub-site)
      - run: npm ci
        working-directory: lss-presentation
      - run: npm run build
        working-directory: lss-presentation

      # Combine: copy LSS into presentation/dist/lss/
      - run: mkdir -p presentation/dist/lss && cp -r lss-presentation/dist/* presentation/dist/lss/

      # Build SDLC presentation (sub-site)
      - run: npm ci
        working-directory: sdlc-presentation
      - run: npm run build
        working-directory: sdlc-presentation

      # Combine: copy SDLC into presentation/dist/sdlc/
      - run: mkdir -p presentation/dist/sdlc && cp -r sdlc-presentation/dist/* presentation/dist/sdlc/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentation/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
